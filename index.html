.chapter-wrap{display:grid;grid-template-columns:1fr;gap:14px;}
.card{background:#fff;border-radius:16px;padding:24px 20px;box-shadow:0 4px 20px rgba(46,125,50,0.1);cursor:pointer;transition:all 0.3s;text-align:center;}

.question-title{font-size:18px;line-height:1.6;color:#333;margin-bottom:24px;font-weight:600;}
.option{padding:16px 20px;background:#f9fbe7;border-radius:12px;margin-bottom:12px;cursor:pointer;transition:all 0.2s;font-size:15px;line-height:1.5;border:2px solid transparent;}
.option:hover{background:#e8f5e9;}
.option.right{background:#c8e6c9;border-color:#4caf50;color:#2e7d32;}
.option.wrong{background:#ffcdd2;border-color:#f44336;color:#c62828;}
button{background:#4caf50;color:#fff;border:none;padding:14px 32px;border-radius:25px;font-size:16px;cursor:pointer;margin-top:16px;}
button:hover{opacity:0.9;}
.result-box{background:#fff;border-radius:20px;padding:40px 28px;max-width:500px;margin:0 auto;text-align:center;box-shadow:0 4px 24px rgba(46,125,50,0.1);}
.result-box h2{color:#2e7d32;margin-bottom:20px;}
@media (max-width:480px){
.unit-grid{grid-template-columns:1fr;}
.card .img-area{font-size:40px;}
}
</style>

//防复制
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('copy', e => e.preventDefault());

let currentUnitIdx = 0;
let currentSectionId = "";
let now = 0, life = 3, combo = 0, score = 0, questions = [];

//渲染单元列表（首页）
function renderUnits(){
  const listWrap = document.getElementById("unitList");
  listWrap.innerHTML = "";
  units.forEach((unit, idx)=>{
    const div = document.createElement("div");
    div.className = "card";
    const totalQ = unit.sections.reduce((sum, s)=>sum + questionBank[s.id].length, 0);
    div.innerHTML = `<div class="img-area">${unit.icon}</div><h3>${unit.name}</h3><p>${unit.sections.length}框题 · 共${totalQ}题</p>`;
    div.onclick = ()=>showSections(idx);
    listWrap.appendChild(div);
  });
}

//显示某一单元的框题列表
function showSections(unitIdx){
  currentUnitIdx = unitIdx;
  const unit = units[unitIdx];
  document.getElementById("unitTitle").innerText = unit.icon + " " + unit.name;
  const listWrap = document.getElementById("sectionList");
  listWrap.innerHTML = "";
  unit.sections.forEach(sec=>{
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<h3>${sec.name}</h3><p>题库${questionBank[sec.id].length}题，每次随机15题</p>`;
    div.onclick = ()=>startQuiz(sec.id);
    listWrap.appendChild(div);
  });
  switchPage("pageSection");
}

//返回单元列表
function backToUnit(){
  showSections(currentUnitIdx);
}

//开始刷题
function startQuiz(sectionId){
  currentSectionId = sectionId;
  questions = shuffle(questionBank[sectionId]).slice(0, 15);
  now = 0; life = 3; combo = 0; score = 0;
  renderQuestion();
  switchPage("pageQuiz");
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function renderQuestion(){
  const q = questions[now];
  document.getElementById("qIndex").innerText = now+1;
  document.getElementById("life").innerText = "❤️".repeat(life) + "🤍".repeat(3-life);
  document.getElementById("combo").innerText = combo;
  document.getElementById("scoreShow").innerText = score;
  document.getElementById("question").innerText = (now+1) + ". " + q.q;
  const optWrap = document.getElementById("optionsWrap");
  optWrap.innerHTML = "";
  q.opt.forEach((op, idx)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.innerText = op;
    div.onclick = ()=>chooseAnswer(div, idx, q.ans);
    optWrap.appendChild(div);
  });
}

function chooseAnswer(el, idx, ans){
  const options = document.querySelectorAll(".option");
  const chosen = options[idx].innerText.charAt(0);
  if(chosen === ans){
    el.classList.add("right");
    combo++;
    score += 10 + combo*2;
  }else{
    el.classList.add("wrong");
    life--;
    combo = 0;
    options.forEach(o=>{ if(o.innerText.charAt(0) === ans) o.classList.add("right"); });
  }
  options.forEach(o=>o.onclick = null);
  setTimeout(()=>{
    if(life<=0){ showResult(); return; }
    now++;
    if(now>=questions.length){ showResult(); return; }
    renderQuestion();
  }, 800);
}

function showResult(){
  let msg = "";
  if(life===3 && score>=150) msg = "太棒了！满分通关，道法小达人就是你！🎉";
  else if(score>=120) msg = "很不错！继续加油，你已经很厉害了！👍";
  else if(score>=80) msg = "还可以，再复习一下错题吧！💪";
  else msg = "别灰心，回去再看看课本，下次一定更好！🌱";
  document.getElementById("resultText").innerHTML = `本次得分：<b style="color:#4caf50;font-size:28px;">${score}</b>分<br>${msg}`;
  switchPage("pageResult");
}

function retryQuiz(){ startQuiz(currentSectionId); }
function backHome(){ switchPage("pageHome"); }

function switchPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}

//初始化
renderUnits();
</script>
